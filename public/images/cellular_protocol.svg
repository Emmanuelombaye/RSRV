<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#17171A" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#0B0B0D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="15%" stop-color="#1C1C21"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="85%" stop-color="#1C1C21"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>

    <linearGradient id="champagneRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2A15F" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#E8D5B0" stop-opacity="1"/>
      <stop offset="70%" stop-color="#C2A15F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A703B" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="capGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A30"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B0B0D"/>
  <rect width="800" height="600" fill="url(#obsidianBg)"/>

  <!-- Pedestal reflection shadow -->
  <ellipse cx="400" cy="510" rx="160" ry="25" fill="#000000" opacity="0.8" filter="url(#softShadow)"/>

  <!-- Main Vessel / Dropper Bottle Silhouette -->
  <!-- Bottle Base & Body -->
  <rect x="310" y="240" width="180" height="250" rx="12" fill="url(#bottleBody)" stroke="#1A1A1E" stroke-width="1"/>

  <!-- Champagne Gold Rim Light Edge (Left/Right hairline) -->
  <path d="M 310 240 L 310 490" fill="none" stroke="url(#champagneRim)" stroke-width="1.5"/>
  <path d="M 490 240 L 490 490" fill="none" stroke="#C2A15F" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Shoulder curve -->
  <path d="M 310 240 C 310 210, 340 195, 365 195 L 435 195 C 460 195, 490 210, 490 240 Z" fill="url(#bottleBody)"/>
  <path d="M 310 240 C 310 210, 340 195, 365 195" fill="none" stroke="url(#champagneRim)" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="370" y="150" width="60" height="45" fill="url(#capGlow)" stroke="#1A1A1E" stroke-width="1"/>

  <!-- Dropper Cap -->
  <rect x="360" y="100" width="80" height="50" rx="4" fill="url(#capGlow)"/>
  <path d="M 360 100 L 360 150" fill="none" stroke="url(#champagneRim)" stroke-width="1.2"/>

  <!-- Soft Label deboss area -->
  <rect x="340" y="270" width="120" height="180" rx="2" fill="#141417" stroke="#22222A" stroke-width="0.75"/>
  <rect x="340" y="270" width="120" height="180" rx="2" fill="none" stroke="#C2A15F" stroke-opacity="0.25" stroke-width="0.5"/>

  <!-- Label text in SVG -->
  <text x="400" y="310" font-family="Archivo, sans-serif" font-size="14" font-weight="700" fill="#F3F1EC" letter-spacing="3" text-anchor="middle">RSRV</text>
  <text x="400" y="325" font-family="Archivo, sans-serif" font-size="7" fill="#9DA1A6" letter-spacing="1.5" text-anchor="middle">CELLULAR LONGEVITY</text>
  <line x1="360" y1="340" x2="440" y2="340" stroke="#3A2E28" stroke-width="1"/>
  <text x="400" y="365" font-family="Archivo, sans-serif" font-size="6.5" fill="#DCDAD4" letter-spacing="1" text-anchor="middle">STERILE NAD+ MATRIX</text>
  <text x="400" y="380" font-family="Archivo, sans-serif" font-size="6" fill="#9DA1A6" letter-spacing="1" text-anchor="middle">US 503A COMPOUNDED</text>
  <text x="400" y="425" font-family="Archivo, sans-serif" font-size="6" fill="#C2A15F" letter-spacing="1" text-anchor="middle">50 MG / ML · ALLOCATION</text>
</svg>
