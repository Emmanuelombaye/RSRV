<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <defs>
    <radialGradient id="telemetryBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#18181D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2A15F" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C2A15F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F3F1EC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="450" fill="#0B0B0D"/>
  <rect width="1000" height="450" fill="url(#telemetryBg)"/>

  <!-- Telemetry Grid Lines -->
  <g stroke="rgba(220,218,212,0.06)" stroke-width="0.75">
    <line x1="100" y1="100" x2="900" y2="100"/>
    <line x1="100" y1="200" x2="900" y2="200"/>
    <line x1="100" y1="300" x2="900" y2="300"/>
    <line x1="250" y1="50" x2="250" y2="380"/>
    <line x1="500" y1="50" x2="500" y2="380"/>
    <line x1="750" y1="50" x2="750" y2="380"/>
  </g>

  <!-- Biomarker Telemetry Wave Signal -->
  <path d="M 100 280 C 200 280, 250 140, 350 140 C 450 140, 500 240, 600 240 C 700 240, 750 120, 900 120" fill="none" stroke="url(#goldBeam)" stroke-width="2.5"/>

  <!-- Diagnostic Telemetry Target Nodes -->
  <circle cx="350" cy="140" r="5" fill="#C2A15F"/>
  <circle cx="350" cy="140" r="10" fill="none" stroke="#C2A15F" stroke-opacity="0.5" stroke-width="1"/>
  <text x="350" y="115" font-family="Archivo, sans-serif" font-size="9" fill="#F3F1EC" font-weight="600" text-anchor="middle">BDNF &gt; 28,000 pg/mL</text>

  <circle cx="750" cy="120" r="5" fill="#C2A15F"/>
  <circle cx="750" cy="120" r="10" fill="none" stroke="#C2A15F" stroke-opacity="0.5" stroke-width="1"/>
  <text x="750" y="95" font-family="Archivo, sans-serif" font-size="9" fill="#F3F1EC" font-weight="600" text-anchor="middle">ApoB &lt; 60 mg/dL</text>

  <!-- Legend annotation -->
  <text x="500" y="390" font-family="Archivo, sans-serif" font-size="10" fill="#9DA1A6" letter-spacing="2" text-anchor="middle">DIAGNOSTIC BIOMARKER TARGET RANGES · 45+ LAB PARAMETERS VERIFIED</text>
</svg>
