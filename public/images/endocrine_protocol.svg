<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#17171A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B0B0D" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="champagneGoldHairline" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2A15F" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C2A15F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F3F1EC" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0B0B0D"/>
  <rect width="800" height="500" fill="url(#obsidianBg)"/>

  <!-- Elegant organic endocrine wave geometry -->
  <g>
    <path d="M 150 250 C 250 150, 350 350, 450 250 C 550 150, 650 350, 750 250" fill="none" stroke="url(#champagneGoldHairline)" stroke-width="1.75"/>
    <path d="M 150 270 C 250 170, 350 370, 450 270 C 550 170, 650 370, 750 270" fill="none" stroke="#DCDAD4" stroke-opacity="0.15" stroke-width="0.75"/>
    <path d="M 150 230 C 250 130, 350 330, 450 230 C 550 130, 650 330, 750 230" fill="none" stroke="#C2A15F" stroke-opacity="0.25" stroke-width="0.75"/>
  </g>

  <!-- Accent nodes -->
  <circle cx="450" cy="250" r="3" fill="#C2A15F"/>
  <circle cx="250" cy="150" r="2" fill="#DCDAD4" opacity="0.8"/>
  <circle cx="650" cy="350" r="2" fill="#DCDAD4" opacity="0.8"/>
</svg>
