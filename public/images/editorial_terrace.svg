<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <radialGradient id="terraceGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A1A20" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0B0B0D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="champagneLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2A15F" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#C2A15F" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F3F1EC" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#0B0B0D"/>
  <rect width="1200" height="600" fill="url(#terraceGlow)"/>

  <!-- Architectural Terrace Line Composition -->
  <g opacity="0.35">
    <line x1="100" y1="480" x2="1100" y2="480" stroke="url(#champagneLine)" stroke-width="1"/>
    <line x1="100" y1="480" x2="350" y2="200" stroke="#DCDAD4" stroke-opacity="0.2" stroke-width="0.75"/>
    <line x1="1100" y1="480" x2="850" y2="200" stroke="#DCDAD4" stroke-opacity="0.2" stroke-width="0.75"/>
    <line x1="350" y1="200" x2="850" y2="200" stroke="url(#champagneLine)" stroke-width="0.75"/>
  </g>

  <!-- Central Ambient Focus -->
  <circle cx="600" cy="300" r="140" fill="none" stroke="#C2A15F" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="600" cy="300" r="180" fill="none" stroke="#DCDAD4" stroke-opacity="0.08" stroke-width="0.5"/>

  <!-- Text Overlay Graphic -->
  <text x="600" y="305" font-family="Archivo, sans-serif" font-size="12" fill="#9DA1A6" letter-spacing="4" text-anchor="middle">THE STANDARD, EXTENDED.</text>
</svg>
